<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#191715"><title>The Loper Residence</title><meta name="apple-mobile-web-app-title" content="Residence"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.json"><style>
*{box-sizing:border-box}body{margin:0;background:#191715;color:#eee5d8;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}header{padding:24px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #514438}h1,h2,h3{font-family:Georgia,serif;font-weight:normal}h1{letter-spacing:6px;margin:0;font-size:clamp(19px,3vw,30px)}small,.muted{color:#c0a98b}nav{display:flex;overflow:auto;padding:12px 4%;gap:8px;position:sticky;top:0;background:#191715;z-index:2}button,a.tile{background:#302923;color:#eee5d8;border:1px solid #645443;border-radius:10px;padding:13px 16px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}button.active,button.primary{background:#c0a98b;color:#191715}main{padding:12px 5% 40px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.panel{background:#25221e;border:1px solid #443a30;border-radius:16px;padding:20px;min-width:0}.wide{grid-column:1/-1}.hero{text-align:center;padding:35px;background:linear-gradient(120deg,#332a23,#211e1a)}.clock{font:64px Georgia,serif}.eyebrow{letter-spacing:3px;font-size:11px;color:#c0a98b;text-transform:uppercase}input,select,textarea{background:#191715;color:#eee5d8;border:1px solid #645443;border-radius:8px;padding:12px;font:inherit;max-width:100%;min-width:0}form{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}form input[type=text]{flex:1}ul{list-style:none;padding:0}li{display:flex;align-items:center;gap:10px;border-bottom:1px solid #443a30;padding:10px 0}li span{flex:1;overflow-wrap:anywhere}li button{padding:7px 10px}input[type=checkbox]{width:22px;height:22px;accent-color:#b59c79}.done{text-decoration:line-through;opacity:.6}.links{display:flex;flex-wrap:wrap;gap:10px}.timer{font:42px Georgia,serif}footer{padding:16px;text-align:center;color:#b59c79;font-size:12px}#notice{color:#e4bc82} @media(max-width:600px){.grid{grid-template-columns:1fr}h1{font-size:19px;letter-spacing:3px}.clock{font-size:48px}header{padding:18px 4%}}
body[data-theme="oatmeal"]{background:#eae4da;color:#30251f}body[data-theme="oatmeal"] nav,body[data-theme="oatmeal"] input,body[data-theme="oatmeal"] select,body[data-theme="oatmeal"] textarea{background:#f5efe6;color:#30251f}body[data-theme="oatmeal"] .panel{background:#f8f3eb;border-color:#c4b29c}body[data-theme="oatmeal"] .muted,body[data-theme="oatmeal"] small,body[data-theme="oatmeal"] .eyebrow{color:#725541}body[data-theme="espresso"]{background:#392a23}body[data-theme="espresso"] .panel{background:#49372e} .settings-form{display:grid;gap:12px}.settings-form label{display:grid;gap:5px}.settings-form input,.settings-form textarea{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap}textarea{width:100%}</style><header><div><h1 id="brand">THE LOPER RESIDENCE</h1><small id="tagline">HOME · FAMILY · LIFE</small></div><button onclick="go('Ambient')">Ambient</button></header><nav id="nav"></nav><main id="main"></main><footer>THE LOPER RESIDENCE · PRIVATE HOUSEHOLD EDITION · LOCAL STORAGE</footer><script>
const tabs=['Home','Agenda','Kitchen','Lounge','Security','Family','Market','Sunday Reset','Settings'];let page='Home';let data={events:[],meals:[],chores:[],groceries:[],pantry:[],reset:[],recipes:[],calendar:''};try{Object.assign(data,JSON.parse(localStorage.getItem('loper-residence-v1')||localStorage.getItem('maison-v1')||'{}'))}catch(e){};let timers=[];const defaults={name:'The Loper Residence',tagline:'HOME · FAMILY · LIFE',motto:'Home is our sanctuary.',welcome:'Welcome home',affirmation:'May this home be filled with peace, joy and love.',theme:'onyx'};function prefs(){return Object.assign({},defaults,data.settings||{})}const $=id=>document.getElementById(id);const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('loper-residence-v1',JSON.stringify(data))}catch(e){alert('Storage unavailable. Export a backup in Settings.')}}function go(p){page=p;render()}function panel(title,body,wide=false){return `<section class="panel ${wide?'wide':''}"><div class="eyebrow">${esc(prefs().name)}</div><h2>${title}</h2>${body}</section>`}function list(k){return '<ul>'+data[k].map((x,i)=>`<li><input type="checkbox" aria-label="Complete item" ${x.done?'checked':''} onchange="toggle('${k}',${i})"><span class="${x.done?'done':''}">${esc(x.text)}</span><button aria-label="Delete item" onclick="del('${k}',${i})">×</button></li>`).join('')+'</ul>'}function add(k,f){let t=f.elements.item.value.trim();if(t){data[k].push({text:t,done:false});save();render()}return false}function toggle(k,i){data[k][i].done=!data[k][i].done;save();render()}function del(k,i){data[k].splice(i,1);save();render()}function editor(k,placeholder){return `<form onsubmit="return add('${k}',this)"><input name="item" type="text" required placeholder="${placeholder}"><button class="primary">Add</button></form>${list(k)}`}function link(n,u){return `<a class="tile" href="${u}" target="_blank" rel="noopener noreferrer">${n} ↗</a>`}function clock(){let d=new Date();if($('clock'))$('clock').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});if($('date'))$('date').textContent=d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});timers.forEach((t,i)=>{let left=Math.max(0,Math.ceil((t.end-Date.now())/1000));if($('timer'+i))$('timer'+i).textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(!left&&!t.done){t.done=true;try{let o=t.audio.createOscillator();o.connect(t.audio.destination);o.start();o.stop(t.audio.currentTime+.8)}catch(e){}alert(t.name+' is finished!')}})}function hero(){return `<section class="panel hero wide"><div class="eyebrow">${esc(prefs().welcome)}</div><div class="clock" id="clock"></div><div id="date"></div><p class="muted">${esc(prefs().motto)}</p></section>`}function timerAdd(f){let m=Number(f.minutes.value);if(m>0){let audio;try{audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}timers.push({name:f.label.value||'Kitchen timer',end:Date.now()+m*60000,audio,done:false});render()}return false}function timerUI(){return `<form onsubmit="return timerAdd(this)"><input name="label" placeholder="Timer name"><input name="minutes" type="number" min="0.1" max="1440" step="0.1" required placeholder="Minutes"><button>Start</button></form>`+timers.map((t,i)=>`<p>${esc(t.name)} <span class="timer" id="timer${i}"></span> <button onclick="timers.splice(${i},1);render()">Clear</button></p>`).join('')+'<small>Keep this dashboard open for timer alerts.</small>'}function render(){let p=prefs();document.body.dataset.theme=p.theme;$('brand').textContent=p.name;$('tagline').textContent=p.tagline;document.title=p.name; $('nav').innerHTML=tabs.map(t=>`<button class="${page===t?'active':''}" onclick="go('${t}')">${t}</button>`).join('');let s='';switch(page){case 'Home':s=hero()+panel('The Agenda',list('events')||'')+panel('The Kitchen',list('meals'))+panel('The Family',list('chores'))+panel('The Market',groceryUI())+panel('The Lounge',link('Spotify','https://open.spotify.com')+' '+link('YouTube','https://www.youtube.com'))+panel('Security',link('Ring doorbell','https://ring.com'));break;case 'Ambient':s=hero()+panel('Daily affirmation','<p style="font:30px Georgia;text-align:center">'+esc(prefs().affirmation)+'</p>',true);break;case 'Agenda':s=panel('Family agenda',editor('events','Date, time and event'),true)+panel('Shared Google Calendar',link('Create or open calendar','https://calendar.google.com')+'<p class="muted">Create a separate The Loper Residence calendar and share it privately with family. This local agenda is not synced.</p>');break;case 'Kitchen':s=panel('Weekly meals',editor('meals','Day and dinner'))+panel('Recipe center',recipeUI())+panel('Missing ingredients',ingredientUI(),true)+panel('Cooking timers',timerUI(),true)+panel('Measurement converter','<form oninput="document.getElementById(\'conversion\').textContent=(Number(this.cups.value)*236.588).toFixed(1)+\' mL\'"><input name="cups" type="number" min="0" step="any" placeholder="US cups"></form><p id="conversion">0 mL</p>');break;case 'Lounge':s=panel('Music & entertainment','<div class="links">'+[['Spotify','https://open.spotify.com'],['Netflix','https://www.netflix.com'],['YouTube','https://www.youtube.com'],['Peacock','https://www.peacocktv.com'],['Tubi','https://tubitv.com']].map(x=>link(...x)).join('')+'</div><p class="muted">Opens each service separately. Use installed apps if browser playback is unsupported.</p>',true);break;case 'Security':s=panel('Front door',link('Open Ring','https://ring.com')+'<p>Sign in to Ring or open the Ring app for Live View. No camera credentials are stored here.</p>',true);break;case 'Family':s=panel('Chores & routines',editor('chores','Family member — chore'),true);break;case 'Market':s=panel('Grocery list',groceryUI())+panel('Pantry & freezer',editor('pantry','Item and quantity'));break;case 'Sunday Reset':s=panel('Weekly reset',editor('reset','Add a weekly planning task'),true);break;case 'Settings':s=panel('Customize your residence',settingsUI(),true)+panel('Your data','<p>Data stays in this browser on this device. Export backups before clearing Safari data. No account or cloud sync is configured.</p><button onclick="backup()">Export backup</button><p>Restore backup (replaces local data)</p><input type="file" accept="application/json,.json" onchange="restore(this)">',true)+panel('Install on iPad','<p>Open the hosted site in Safari, tap Share, then Add to Home Screen. Use landscape orientation. For movies and music, exit Guided Access if enabled.</p>');break} $('main').innerHTML='<div class="grid">'+s+'</div>';clock()}
function settingsUI(){let p=prefs();return `<form class="settings-form" onsubmit="return saveSettings(this)">${[['name','Household name'],['tagline','Tagline'],['motto','Household motto'],['welcome','Welcome message'],['affirmation','Daily affirmation']].map(([k,l])=>`<label>${l}<input name="${k}" value="${esc(p[k])}"></label>`).join('')}<label>Theme<select name="theme">${['onyx','oatmeal','espresso'].map(t=>`<option ${p.theme===t?'selected':''}>${t}</option>`).join('')}</select></label><button class="primary">Save settings</button></form><small>Settings are local to this device; parent-only access will require authentication.</small>`}
function saveSettings(f){data.settings={};Object.keys(defaults).forEach(k=>data.settings[k]=f.elements[k].value);save();render();return false}
function groceryUI(){return editor('groceries','Add grocery item')+`<div class="actions"><button onclick="copyGroceries()">Copy needed groceries</button><button onclick="textGroceries()">Text groceries</button><button onclick="shareGroceries()">Share list</button></div><p class="muted">${data.groceries.filter(x=>!x.done).length} items still needed</p>`}
function groceryText(){return 'Groceries we need:\n'+data.groceries.filter(x=>!x.done).map(x=>'• '+x.text).join('\n')}
function hasGroceries(){if(!data.groceries.some(x=>!x.done)){alert('No missing groceries.');return false}return true}
async function copyGroceries(){if(!hasGroceries())return;try{await navigator.clipboard.writeText(groceryText());alert('Grocery list copied.')}catch(e){prompt('Copy your grocery list:',groceryText())}}
function textGroceries(){if(!hasGroceries())return;let apple=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);location.href='sms:'+(apple?'&':'?')+'body='+encodeURIComponent(groceryText())}
async function shareGroceries(){if(!hasGroceries())return;if(navigator.share){try{await navigator.share({text:groceryText()})}catch(e){if(e.name!=='AbortError')copyGroceries()}}else copyGroceries()}
function recipeUI(){return `<form onsubmit="return searchRecipe(this)"><input name="query" type="text" required placeholder="Search recipes, e.g. garlic chicken"><button class="primary">Find recipes</button></form><small>Search opens recipe results in a new tab. Save a recipe name or URL below.</small>${editor('recipes','Recipe name or URL')}${data.recipes.filter(x=>/^https?:\/\//i.test(x.text)).map(x=>`<p>${link('Open saved recipe',esc(x.text))}</p>`).join('')}`}
function searchRecipe(f){window.open('https://www.google.com/search?q='+encodeURIComponent(f.query.value+' recipe'),'_blank','noopener,noreferrer');return false}
function ingredientUI(){return `<form class="settings-form" onsubmit="return loadIngredients(this)"><label>Paste or type ingredients, one per line<textarea name="ingredients" rows="5" placeholder="Chicken breast&#10;Heavy cream&#10;Garlic"></textarea></label><button>Build checklist</button></form>${(data.ingredients||[]).map((x,i)=>`<p><label><input type="checkbox" ${x.done?'checked':''} onchange="data.ingredients[${i}].done=this.checked;save()"> ${esc(x.text)} — already have</label></p>`).join('')}<button class="primary" onclick="missingToGroceries()">Add missing to groceries</button><p class="muted">Check ingredients you already have. Unchecked items will be added to your grocery list.</p>`}
function loadIngredients(f){data.ingredients=f.ingredients.value.split(/\n/).map(x=>x.trim()).filter(Boolean).map(text=>({text,done:false}));save();render();return false}
function missingToGroceries(){let n=0;for(let x of data.ingredients||[]){if(x.done)continue;let old=data.groceries.find(y=>y.text.trim().toLowerCase()===x.text.trim().toLowerCase());if(old){if(old.done){old.done=false;n++}}else{data.groceries.push({text:x.text,done:false});n++}}save();alert(n+' items added or reopened.');go('Market')}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='loper-residence-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restore(el){if(!el.files[0])return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);for(let k of ['events','meals','chores','groceries','pantry','reset','recipes'])if(!Array.isArray(v[k])||v[k].some(x=>!x||typeof x.text!=='string'))throw Error();if(confirm('Replace current local data?')){data=v;save();render()}}catch(e){alert('Invalid backup')}};r.readAsText(el.files[0])}render();setInterval(clock,1000);if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
