<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#191715"><title>The Loper Residence</title><meta name="apple-mobile-web-app-title" content="Residence"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.json"><style>
*{box-sizing:border-box}body{margin:0;background:#191715;color:#eee5d8;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}header{padding:24px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #514438}h1,h2,h3{font-family:Georgia,serif;font-weight:normal}h1{letter-spacing:6px;margin:0;font-size:clamp(19px,3vw,30px)}small,.muted{color:#c0a98b}nav{display:flex;overflow:auto;padding:12px 4%;gap:8px;position:sticky;top:0;background:#191715;z-index:2}button,a.tile{background:#302923;color:#eee5d8;border:1px solid #645443;border-radius:10px;padding:13px 16px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}button.active,button.primary{background:#c0a98b;color:#191715}main{padding:12px 5% 40px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.panel{background:#25221e;border:1px solid #443a30;border-radius:16px;padding:20px;min-width:0}.wide{grid-column:1/-1}.hero{text-align:center;padding:35px;background:linear-gradient(120deg,#332a23,#211e1a)}.clock{font:64px Georgia,serif}.eyebrow{letter-spacing:3px;font-size:11px;color:#c0a98b;text-transform:uppercase}input,select,textarea{background:#191715;color:#eee5d8;border:1px solid #645443;border-radius:8px;padding:12px;font:inherit;max-width:100%;min-width:0}form{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}form input[type=text]{flex:1}ul{list-style:none;padding:0}li{display:flex;align-items:center;gap:10px;border-bottom:1px solid #443a30;padding:10px 0}li span{flex:1;overflow-wrap:anywhere}li button{padding:7px 10px}input[type=checkbox]{width:22px;height:22px;accent-color:#b59c79}.done{text-decoration:line-through;opacity:.6}.links{display:flex;flex-wrap:wrap;gap:10px}.timer{font:42px Georgia,serif}footer{padding:16px;text-align:center;color:#b59c79;font-size:12px}#notice{color:#e4bc82} @media(max-width:600px){.grid{grid-template-columns:1fr}h1{font-size:19px;letter-spacing:3px}.clock{font-size:48px}header{padding:18px 4%}}
</style><header><div><h1>THE LOPER RESIDENCE</h1><small>HOME · FAMILY · LIFE</small></div><button onclick="go('Ambient')">Ambient</button></header><nav id="nav"></nav><main id="main"></main><footer>THE LOPER RESIDENCE · PRIVATE HOUSEHOLD EDITION · LOCAL STORAGE</footer><script>
const tabs=['Home','Agenda','Kitchen','Lounge','Security','Family','Market','Sunday Reset','Settings'];let page='Home';let data={events:[],meals:[],chores:[],groceries:[],pantry:[],reset:[],recipes:[],calendar:''};try{Object.assign(data,JSON.parse(localStorage.getItem('loper-residence-v1')||localStorage.getItem('maison-v1')||'{}'))}catch(e){};let timers=[];const $=id=>document.getElementById(id);const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('loper-residence-v1',JSON.stringify(data))}catch(e){alert('Storage unavailable. Export a backup in Settings.')}}function go(p){page=p;render()}function panel(title,body,wide=false){return `<section class="panel ${wide?'wide':''}"><div class="eyebrow">The Loper Residence</div><h2>${title}</h2>${body}</section>`}function list(k){return '<ul>'+data[k].map((x,i)=>`<li><input type="checkbox" aria-label="Complete item" ${x.done?'checked':''} onchange="toggle('${k}',${i})"><span class="${x.done?'done':''}">${esc(x.text)}</span><button aria-label="Delete item" onclick="del('${k}',${i})">×</button></li>`).join('')+'</ul>'}function add(k,f){let t=f.elements.item.value.trim();if(t){data[k].push({text:t,done:false});save();render()}return false}function toggle(k,i){data[k][i].done=!data[k][i].done;save();render()}function del(k,i){data[k].splice(i,1);save();render()}function editor(k,placeholder){return `<form onsubmit="return add('${k}',this)"><input name="item" type="text" required placeholder="${placeholder}"><button class="primary">Add</button></form>${list(k)}`}function link(n,u){return `<a class="tile" href="${u}" target="_blank" rel="noopener noreferrer">${n} ↗</a>`}function clock(){let d=new Date();if($('clock'))$('clock').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});if($('date'))$('date').textContent=d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});timers.forEach((t,i)=>{let left=Math.max(0,Math.ceil((t.end-Date.now())/1000));if($('timer'+i))$('timer'+i).textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(!left&&!t.done){t.done=true;try{let o=t.audio.createOscillator();o.connect(t.audio.destination);o.start();o.stop(t.audio.currentTime+.8)}catch(e){}alert(t.name+' is finished!')}})}function hero(){return `<section class="panel hero wide"><div class="eyebrow">Welcome home</div><div class="clock" id="clock"></div><div id="date"></div><p class="muted">Home is our sanctuary.</p></section>`}function timerAdd(f){let m=Number(f.minutes.value);if(m>0){let audio;try{audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}timers.push({name:f.label.value||'Kitchen timer',end:Date.now()+m*60000,audio,done:false});render()}return false}function timerUI(){return `<form onsubmit="return timerAdd(this)"><input name="label" placeholder="Timer name"><input name="minutes" type="number" min="0.1" max="1440" step="0.1" required placeholder="Minutes"><button>Start</button></form>`+timers.map((t,i)=>`<p>${esc(t.name)} <span class="timer" id="timer${i}"></span> <button onclick="timers.splice(${i},1);render()">Clear</button></p>`).join('')+'<small>Keep this dashboard open for timer alerts.</small>'}function render(){ $('nav').innerHTML=tabs.map(t=>`<button class="${page===t?'active':''}" onclick="go('${t}')">${t}</button>`).join('');let s='';switch(page){case 'Home':s=hero()+panel('The Agenda',list('events')||'')+panel('The Kitchen',list('meals'))+panel('The Family',list('chores'))+panel('The Market',list('groceries'))+panel('The Lounge',link('Spotify','https://open.spotify.com')+' '+link('YouTube','https://www.youtube.com'))+panel('Security',link('Ring doorbell','https://ring.com'));break;case 'Ambient':s=hero()+panel('Our sanctuary','<p style="font:30px Georgia;text-align:center">May this home be filled with peace, joy and love.</p>',true);break;case 'Agenda':s=panel('Family agenda',editor('events','Date, time and event'),true)+panel('Shared Google Calendar',link('Create or open calendar','https://calendar.google.com')+'<p class="muted">Create a separate The Loper Residence calendar and share it privately with family. This local agenda is not synced.</p>');break;case 'Kitchen':s=panel('Weekly meals',editor('meals','Day and dinner'))+panel('Recipes',editor('recipes','Recipe or recipe URL'))+panel('Cooking timers',timerUI(),true)+panel('Measurement converter','<form oninput="document.getElementById(\'conversion\').textContent=(Number(this.cups.value)*236.588).toFixed(1)+\' mL\'"><input name="cups" type="number" min="0" step="any" placeholder="US cups"></form><p id="conversion">0 mL</p>');break;case 'Lounge':s=panel('Music & entertainment','<div class="links">'+[['Spotify','https://open.spotify.com'],['Netflix','https://www.netflix.com'],['YouTube','https://www.youtube.com'],['Peacock','https://www.peacocktv.com'],['Tubi','https://tubitv.com']].map(x=>link(...x)).join('')+'</div><p class="muted">Opens each service separately. Use installed apps if browser playback is unsupported.</p>',true);break;case 'Security':s=panel('Front door',link('Open Ring','https://ring.com')+'<p>Sign in to Ring or open the Ring app for Live View. No camera credentials are stored here.</p>',true);break;case 'Family':s=panel('Chores & routines',editor('chores','Family member — chore'),true);break;case 'Market':s=panel('Grocery list',editor('groceries','Add grocery item'))+panel('Pantry & freezer',editor('pantry','Item and quantity'));break;case 'Sunday Reset':s=panel('Weekly reset',editor('reset','Add a weekly planning task'),true);break;case 'Settings':s=panel('Your data','<p>Data stays in this browser on this device. Export backups before clearing Safari data. No account or cloud sync is configured.</p><button onclick="backup()">Export backup</button><p>Restore backup (replaces local data)</p><input type="file" accept="application/json,.json" onchange="restore(this)">',true)+panel('Install on iPad','<p>Open the hosted site in Safari, tap Share, then Add to Home Screen. Use landscape orientation. For movies and music, exit Guided Access if enabled.</p>');break} $('main').innerHTML='<div class="grid">'+s+'</div>';clock()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='loper-residence-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restore(el){if(!el.files[0])return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);for(let k of ['events','meals','chores','groceries','pantry','reset','recipes'])if(!Array.isArray(v[k])||v[k].some(x=>!x||typeof x.text!=='string'))throw Error();if(confirm('Replace current local data?')){data=v;save();render()}}catch(e){alert('Invalid backup')}};r.readAsText(el.files[0])}render();setInterval(clock,1000);if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
